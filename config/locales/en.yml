# English locale — default and only locale for now.
#
# Conventions (see docs/specs):
# - Controllers use lazy lookup (t(".key") => "<controller>.<action>.<key>");
#   keys shared across actions live at the controller root (e.g. passwords.invalid_token).
# - Cross-cutting flash text lives under `flash.`.
# - Service-layer error strings live under `errors.`.
# - Mailer subjects follow Action Mailer's default_i18n_subject scope
#   (`<mailer_underscored>.<action>.subject`).
#
# YAML interprets true/false/on/off/yes/no as booleans — quote them if needed as strings.

en:
  flash:
    rate_limited: "Try again later."
  sessions:
    create:
      invalid_credentials: "Try another email address or password."
  passwords:
    invalid_token: "Password reset link is invalid or has expired."
    create:
      instructions_sent: "Password reset instructions sent (if user with that email address exists)."
    update:
      reset: "Password has been reset."
      mismatch: "Passwords did not match."
  email_confirmations:
    show:
      confirmed: "Email confirmed. Welcome to SRO Labs!"
      invalid_token: "That confirmation link is invalid or has expired."
    resend:
      sent: "If your account still needs confirmation, we've sent a new link."
  characters:
    create:
      created: "Character created."
    update:
      updated: "Character updated."
    destroy:
      deleted: "Character deleted."
  passwords_mailer:
    reset:
      subject: "Reset your password"
  users_mailer:
    email_confirmation:
      subject: "Confirm your email"
  errors:
    skill_level:
      below_zero: "%{attr} must be >= 0"
      above_max: "%{attr} must be <= %{max}"
  warnings:
    character_level_updated: "character.%{attr} updated to %{value}"
    character_mastery_created: "CharacterMastery '%{name}' created automatically"
    character_mastery_level_updated: "CharacterMastery '%{name}' current_mastery_level updated to %{level}"
    prerequisite_added: "prerequisite '%{name}' added automatically"
    prerequisite_level_updated: "prerequisite '%{name}' current_skill_level updated to %{level}"
    skill_level_adjusted: "skill '%{name}' %{attr} adjusted to %{level}"
    level_datum_missing: "LevelDatum missing for level %{level}; SP cost treated as 0"
