# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  characters:
    create:
      notice_created: "Character created."
    new:
      label_name: "Character name"
      placeholder_name: "My character"
      label_race: "Char type"
      label_choose: "Choose"
      label_level_cap: "Server level cap"
      submit: "Start Build"
  sessions:
    create:
      alert_rate_limit: "Try again later."
      alert_invalid: "Try another email address or password."
  passwords:
    create:
      alert_rate_limit: "Try again later."
      notice_reset_sent: "Password reset instructions sent (if user with that email address exists)."
    update:
      notice_reset_ok: "Password has been reset."
      alert_mismatch: "Passwords did not match."
    set_user_by_token:
      alert_bad_token: "Password reset link is invalid or has expired."
  home:
    index:
      no_characters: "You have no characters yet."
      guest_heading: "Plan your Silkroad build"
      guest_body: "Sign in to create characters and plan skill builds for any level cap."
  errors:
    character:
      invalid_target_level: "Target level must be one of: %{valid}"
  warnings:
    character_level_updated: "character.%{attr} updated to %{value}"
    character_mastery_created: "CharacterMastery '%{name}' created automatically"
    character_mastery_level_updated: "CharacterMastery '%{name}' current_mastery_level updated to %{level}"
    prerequisite_added: "prerequisite '%{name}' added automatically"
    prerequisite_level_updated: "prerequisite '%{name}' current_skill_level updated to %{level}"
    skill_level_adjusted: "skill '%{name}' %{attr} adjusted to %{level}"
