<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Skill Editor — Partial</title>
<style>
  :root{
    --bg:#0c0e12;
    --card:#15181f;
    --card-hi:#1c2029;
    --line:#262a33;
    --text:#e6e8ec;
    --text-dim:#8b919e;
    --text-mute:#5c6270;
    --brass:#d4a847;
    --brass-hi:#f4d878;
    --blue:#4ea3ff;
    --red:#e85a4a;
    --green:#38b676;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);height:100%;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 50% -10%, #1a1d24 0%, #0c0e12 60%);
    -webkit-font-smoothing:antialiased;
  }
  #root{height:100%;}
  button{font-family:inherit;}
  input{font-family:inherit;}
  h1,h2,h3{margin:0;font-size:inherit;font-weight:inherit;}

  .btn-primary{
    padding:9px 14px;border-radius:10px;border:0;cursor:pointer;
    background:linear-gradient(180deg,var(--brass-hi),var(--brass));
    color:var(--bg);font-weight:800;font-size:13px;letter-spacing:0.2px;
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{
    padding:9px 14px;border-radius:10px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--text);
    font-weight:600;font-size:13px;
  }
  .btn-ghost:hover{background:var(--card-hi);}

  /* ───── Top bar (matches Home) ───────────────────────────────────── */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:rgba(12,14,18,0.85);
    backdrop-filter:saturate(140%) blur(12px);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .topbar-inner{
    max-width:1280px;margin:0 auto;
    padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  @media (min-width: 900px){ .topbar-inner{padding:14px 32px;} }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:0.2px;}
  .brand-mark{
    width:28px;height:28px;border-radius:7px;
    background:linear-gradient(135deg,var(--brass),#6b4a18);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;
  }
  .nav{display:none;gap:6px;flex:1;justify-content:center;}
  @media (min-width: 900px){ .nav{display:flex;} }
  .nav a{
    padding:8px 12px;border-radius:8px;font-size:13px;color:var(--text-dim);cursor:pointer;
  }
  .nav a:hover{color:var(--text);background:var(--card);}
  .nav a.on{color:var(--text);background:var(--card);}
  .top-actions{display:flex;gap:8px;align-items:center;}
  .chars-pill{
    display:flex;align-items:center;gap:8px;
    padding:6px 6px 6px 10px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);
    cursor:pointer;
  }
  .chars-pill .count{
    background:var(--brass);color:var(--bg);
    width:20px;height:20px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;
  }

  @keyframes fadein{from{opacity:0;}to{opacity:1;}}

  /* ───── Skill editor partial (no modal wrapper) ──────────────────── */

  .fs{
    position:relative;
    width:100%;height:100%;
    display:flex;flex-direction:column;
    background:var(--bg);
  }

  .fs-head{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    flex-shrink:0;
  }
  .fs-back{
    width:44px;height:44px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .fs-back:hover{background:var(--card-hi);}
  .fs-title{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .fs-title-tag{
    font-size:11px;font-weight:800;letter-spacing:0.8px;
    padding:2px 8px;border-radius:6px;
  }
  .fs-tag-current{background:rgba(255,255,255,0.08);color:var(--text);}
  .fs-tag-future{background:rgba(244,216,120,0.16);color:var(--brass-hi);}
  .fs-title-name{font-size:16px;font-weight:700;letter-spacing:-0.2px;}

  .fs-body{
    flex:1;overflow-y:auto;
    padding:16px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .fs-body::-webkit-scrollbar{display:none;}
  @media (min-width: 900px){ .fs-body{padding:20px 28px;} }

  /* Editor panel — same card style as Home "Skills" box */
  .fs-panel{
    max-width:800px;margin:0 auto;
    background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px;
    display:flex;flex-direction:column;gap:14px;
  }
  @media (min-width: 900px){ .fs-panel{padding:18px;} }
  /* Character identity bar (matches Home) */
  .char-bar{
    display:flex;align-items:center;justify-content:space-between;gap:14px 20px;
    flex-wrap:wrap;
    background:var(--card-hi);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
  }
  .char-bar-id{display:flex;align-items:center;gap:14px;flex-shrink:0;min-width:0;}
  .char-avatar{
    width:52px;height:52px;flex-shrink:0;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(139,31,31,0.5), var(--card));
    box-shadow:0 0 0 3px var(--brass) inset, 0 0 0 1px rgba(0,0,0,0.6), 0 0 14px rgba(212,168,71,0.25);
  }
  .char-bar-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .char-bar-name{
    margin:0;
    font-size:24px;font-weight:800;letter-spacing:-0.5px;
    color:var(--brass-hi);line-height:1.1;
  }
  .char-bar-race{font-size:13px;font-weight:700;color:var(--text-mute);letter-spacing:0.2px;}
  .char-bar-level{display:inline-flex;align-items:baseline;gap:8px;flex-shrink:0;}
  .char-bar-level-label{font-size:13px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;text-transform:uppercase;}
  .char-bar-level-val{font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-0.5px;}
  @media (max-width: 560px){
    .char-bar-name{font-size:20px;}
    .char-bar-level-val{font-size:22px;}
    .char-avatar{width:46px;height:46px;}
  }

  .fs-panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:2px;
  }
  .fs-panel-title{
    font-size:13px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;
    color:var(--text-dim);
  }

  /* Group + Mastery tabs — boxed like Home "Skills" card */
  .fs-tabs{
    display:flex;flex-direction:column;gap:12px;
    background:var(--card-hi);
    border-radius:14px;padding:14px;
  }

  /* Home-page pill + underline tab styles */
  .ro-tabs{
    display:flex;gap:4px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px;
    width:100%;
  }
  .ro-tab{
    all:unset;
    flex:1;
    cursor:pointer;
    padding:0;min-height:44px;text-align:center;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
    color:var(--text-dim);
    border-radius:7px;
    box-sizing:border-box;
  }
  .ro-tab.on{
    background:var(--bg);
    color:var(--text);
    box-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  .ro-subtabs{
    display:flex;gap:4px;
    width:100%;
    padding:0;
  }
  .ro-subtab{
    all:unset;cursor:pointer;
    flex:1 1 0;min-width:0;
    min-height:44px;
    display:inline-flex;align-items:center;justify-content:center;
    text-align:center;
    font-size:13px;font-weight:600;
    color:var(--text-mute);
    position:relative;
  }
  .ro-subtab:hover{color:var(--text-dim);}
  .ro-subtab.on{color:var(--text);}
  .ro-subtab.on::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:8px;
    width:60%;max-width:64px;
    height:2px;background:var(--brass);border-radius:1px;
  }

  /* Mastery summary card */
  .fs-mastery{
    background:var(--card-hi);
    border-radius:14px;
    padding:14px 16px;
    display:flex;flex-direction:column;gap:14px;
  }
  .fs-mastery-info{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .fs-mastery-name{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-0.3px;}
  .fs-mastery-icon{
    width:32px;height:32px;border-radius:8px;flex-shrink:0;
    object-fit:cover;
    box-shadow:0 0 0 1px var(--line);
  }
  .fs-mastery-sub{color:var(--text-mute);font-size:13px;font-weight:500;letter-spacing:0;}
  .fs-mastery-stats{display:flex;gap:14px;flex-wrap:wrap;}
  .fs-mastery-stats > span{display:inline-flex;align-items:baseline;gap:6px;}
  .fs-stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;}
  .fs-stat-val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .fs-stat-of{font-size:12px;color:var(--text-mute);font-variant-numeric:tabular-nums;}

  .fs-mastery-controls{display:flex;align-items:center;gap:10px;}
  .fs-mastery-bar{
    flex:1;height:8px;border-radius:999px;
    background:rgba(255,255,255,0.05);
    overflow:hidden;
    position:relative;
  }
  .fs-mastery-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--brass) 0%, var(--brass-hi) 100%);
    transition:width 180ms ease-out;
  }

  /* Bulk actions */
  .fs-actions{display:flex;gap:8px;margin:16px 0 18px;flex-wrap:wrap;}
  .fs-actions > button{flex:1;min-width:120px;}

  /* Series */
  .fs-series-list{display:flex;flex-direction:column;gap:18px;}
  .fs-series{
    background:var(--card-hi);
    border-radius:14px;
    overflow:hidden;
  }
  .fs-series-head{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    cursor:pointer;
    user-select:none;-webkit-user-select:none;
  }
  .fs-series-head:hover{background:rgba(255,255,255,0.04);}
  .fs-series-trigger{
    all:unset;cursor:pointer;
    display:flex;align-items:center;gap:10px;
    border-radius:8px;
  }
  .fs-series-trigger:hover .fs-series-name{color:var(--brass-hi);}
  .fs-info-icon-glyph{
    display:flex;align-items:center;justify-content:center;
    color:var(--brass-hi);font-size:26px;font-weight:800;
    padding:0;
  }
  .fs-series.is-collapsed .fs-series-head{border-bottom:none;}
  .fs-series-toggle{
    all:unset;cursor:pointer;margin-left:auto;
    width:32px;height:32px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
    border:1px solid var(--line);
    background:var(--card-hi);
    flex-shrink:0;
  }
  .fs-series-toggle:hover{color:var(--text);border-color:#3a3f4b;}
  .fs-chevron{
    font-size:16px;line-height:1;display:block;
    transition:transform 180ms ease;
    transform:rotate(180deg);
  }
  .fs-series.is-collapsed .fs-chevron{transform:rotate(0deg);}
  .fs-series-glyph{
    width:32px;height:32px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(180deg, rgba(212,168,71,0.18), rgba(212,168,71,0.04));
    color:var(--brass-hi);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;
    border:1px solid rgba(212,168,71,0.25);
  }
  .fs-series-name{font-size:13px;font-weight:700;letter-spacing:0.2px;}
  .fs-series-count{
    font-size:11px;color:var(--text-mute);
    font-variant-numeric:tabular-nums;
  }
  .fs-series-body{display:flex;flex-direction:column;}

  /* Skill row */
  .fs-skill-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;
    border-top:1px solid var(--line);
    min-height:64px;
  }
  .fs-skill-row:first-child{border-top:none;}
  .fs-skill-icon{
    all:unset;cursor:pointer;
    width:44px;height:44px;
    border-radius:10px;
    background:linear-gradient(180deg, #0a0a0b, #161618);
    box-shadow:0 0 0 1px #6b5a30 inset, 0 0 0 2px #000 inset;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .fs-skill-trigger{
    all:unset;cursor:pointer;
    flex:1;min-width:0;
