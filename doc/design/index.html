<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Skill Planner — Home</title>
<style>
  :root{
    --bg:#0c0e12;
    --card:#15181f;
    --card-hi:#1c2029;
    --line:#262a33;
    --text:#e6e8ec;
    --text-dim:#8b919e;
    --text-mute:#5c6270;
    --brass:#d4a847;
    --brass-hi:#f4d878;
    --blue:#4ea3ff;
    --red:#e85a4a;
    --green:#38b676;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 50% -10%, #1a1d24 0%, #0c0e12 60%);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  input{font-family:inherit;}
  h1,h2,h3{margin:0;font-size:inherit;font-weight:inherit;}

  /* layout */
  .shell{max-width:1280px;margin:0 auto;padding:0 16px 120px;}
  @media (min-width: 900px){ .shell{padding:0 32px 60px;} }
  #root{padding:0;}
  /* Body content wrapper — topbar is full-bleed; first element sits 16/20px below it (matches skill_editor .fs-body) */
  .home-body{padding:16px 16px 100px;}
  @media (min-width: 900px){ .home-body{padding:20px 32px 80px;} }

  .topbar{
    position:sticky;top:0;z-index:10;
    background:rgba(12,14,18,0.85);
    backdrop-filter:saturate(140%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1280px;margin:0 auto;
    padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  @media (min-width: 900px){ .topbar-inner{padding:14px 32px;} }
  /* Match skill_editor topbar height: action button sized like its chars-pill, not a 44px CTA */
  .topbar .top-actions .btn-primary{min-height:0;padding:9px 14px;}

  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:0.2px;}
  .brand-mark{
    width:28px;height:28px;border-radius:7px;
    background:linear-gradient(135deg,var(--brass),#6b4a18);
    color:var(--bg);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;
  }
  .nav{display:none;gap:6px;flex:1;justify-content:center;}
  @media (min-width: 900px){ .nav{display:flex;} }
  .nav a{
    padding:8px 12px;border-radius:8px;font-size:13px;color:var(--text-dim);
  }
  .nav a:hover{color:var(--text);background:var(--card);}
  .nav a.on{color:var(--text);background:var(--card);}

  .top-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;
    background:var(--card);border:1px solid var(--line);
    color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{color:var(--text);background:var(--card-hi);}

  .btn-primary{
    padding:9px 16px;min-height:44px;border-radius:10px;border:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,var(--brass-hi),var(--brass));
    color:var(--bg);font-weight:800;font-size:13px;letter-spacing:0.2px;
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{
    padding:9px 16px;min-height:44px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);color:var(--text);
    font-weight:600;font-size:13px;
  }
  .btn-ghost:hover{background:var(--card-hi);}

  /* hero / build header */
  .hero{
    margin-top:18px;
    padding:18px;border-radius:18px;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(212,168,71,0.10), transparent 60%),
      linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
    border:1px solid var(--line);
    display:flex;flex-direction:column;gap:16px;
  }
  @media (min-width: 900px){
    .hero{padding:24px;flex-direction:row;align-items:stretch;gap:24px;}
  }

  /* two-card hero: Character + Summary */
  .hero-split{
    margin:0 auto;
    max-width:800px;
    display:grid;gap:14px;
    grid-template-columns:1fr;
  }
  @media (min-width: 900px){
    .hero-split{
      grid-template-columns:1fr;
      gap:14px;
      align-items:stretch;
    }
  }

  /* Body panel — mirrors skill_editor .fs-panel: one --card frame, 14px rhythm */
  .home-panel{
    max-width:800px;margin:14px auto 0;
    background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px;
    display:flex;flex-direction:column;gap:14px;
  }
  @media (min-width: 900px){ .home-panel{padding:18px;} }
  .home-panel .stats-grid{gap:14px;}
  .home-panel .stat{background:var(--card-hi);}

  /* Summary box — reuses skill box (.planner-card) frame; inner stat cards lift to --card-hi */
  .summary-card .stats-grid{gap:14px;}
  .summary-card .stat{background:var(--card-hi);}
  /* Planner flows inside the panel as content, not its own card */
  .home-panel .planner-card{
    background:transparent;border:0;border-radius:0;padding:0;overflow:visible;
  }
  .hero-split .hero{
    margin-top:0;
    padding:0;
    background:none;
    border:0;
    border-radius:0;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    height:100%;
  }
  @media (min-width: 900px){
    .hero-split .hero{padding:0;}
  }
  .hero-summary .hero-right{
    min-width:0;max-width:none;
    width:100%;
    justify-content:center;
  }
  .hero-summary .stats-grid{grid-template-columns:1fr;}
  .hero-left{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0;}
  .hero-right{
    display:flex;flex-direction:column;gap:8px;
    min-width:0;
  }
  @media (min-width: 900px){
    .hero-right{min-width:280px;max-width:320px;}
  }

  .build-name{
    width:100%;border-radius:10px;
    background:var(--card);border:1px solid var(--line);
    color:var(--text);padding:11px 12px;font-size:14px;
  }
  .build-name:focus{outline:none;border-color:var(--brass);}

  /* character identity bar (matches Skill Editor) */
  .char-bar{
    display:flex;align-items:center;justify-content:space-between;gap:14px 20px;
    flex-wrap:wrap;
    background:var(--card-hi);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
  }
  .char-bar-id{display:flex;align-items:center;gap:14px;flex-shrink:0;min-width:0;}
  .char-avatar{
    width:52px;height:52px;flex-shrink:0;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(139,31,31,0.5), var(--card));
    box-shadow:0 0 0 3px var(--brass) inset, 0 0 0 1px rgba(0,0,0,0.6), 0 0 14px rgba(212,168,71,0.25);
  }
  .char-bar-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .char-bar-name{
    margin:0;
    font-size:24px;font-weight:800;letter-spacing:-0.5px;
    color:var(--brass-hi);line-height:1.1;
  }
  .char-bar-race{font-size:13px;font-weight:700;color:var(--text-mute);letter-spacing:0.2px;}
  .char-bar-level{display:inline-flex;align-items:baseline;gap:8px;flex-shrink:0;}
  .char-bar-level-label{font-size:13px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;text-transform:uppercase;}
  .char-bar-level-val{font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-0.5px;}
  @media (max-width: 560px){
    .char-bar-name{font-size:20px;}
    .char-bar-level-val{font-size:22px;}
    .char-avatar{width:46px;height:46px;}
  }

  .stats-grid{
    display:grid;gap:10px;
    grid-template-columns:1fr;
  }
  .stat{
    padding:12px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);
  }
  .stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;}
  .stat-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px;}
  .stat-val{font-size:15px;font-weight:700;color:var(--text-dim);font-variant-numeric:tabular-nums;letter-spacing:-0.2px;}
  .stat-future{color:var(--brass-hi);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.2px;}
  .stat-arrow{color:var(--text-mute);font-size:11px;}
  .stat-delta{color:var(--green);font-size:11px;font-weight:700;}

  /* one-line summary cards: label … current + delta = future */
  .stat-inline{display:flex;align-items:baseline;gap:10px 12px;flex-wrap:wrap;}
  .stat-inline .stat-label{flex:0 0 auto;}
  .stat-inline .stat-eq{
    margin-left:auto;
    display:inline-flex;align-items:baseline;gap:8px;
    font-variant-numeric:tabular-nums;
  }
  .stat-op{color:var(--text-mute);font-size:14px;font-weight:700;}

  /* merged summary: a single card with three divided rows */
  .stat-merged{
    background:var(--card-hi);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .stat-line{
    display:flex;align-items:baseline;gap:10px 12px;flex-wrap:wrap;
    padding:14px 14px;
    border-top:1px solid var(--line);
  }
  .stat-line:first-child{border-top:none;}
  .stat-line .stat-label{flex:0 0 auto;}
  .stat-line .stat-eq{
    margin-left:auto;
    display:inline-flex;align-items:baseline;gap:8px;
    font-variant-numeric:tabular-nums;
  }

  /* section title */
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:28px 0 14px;
  }
  .section-title{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px;}
  .section-sub{font-size:13px;color:var(--text-mute);}

  /* skill windows area */
  .planner-grid{
    max-width:800px;margin:18px auto 0;justify-items:center;
    display:grid;gap:18px;
    grid-template-columns:1fr;
    align-items:start;
    margin-top:20px;
  }
  .planner-card{
    background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:14px;
    display:flex;flex-direction:column;gap:12px;
    overflow:hidden;
  }
  .planner-card.future{border-color:rgba(212,168,71,0.45);}
  .planner-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .planner-tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:0.4px;
  }
  .tag-current{background:rgba(255,255,255,0.08);color:var(--text);}
  .tag-future{background:rgba(244,216,120,0.14);color:var(--brass-hi);}
  .planner-info{font-size:11px;color:var(--text-dim);}
  .planner-title{
    font-size:13px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;
    color:var(--text-dim);
  }
  .legend-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:999px;
    background:var(--card-hi);border:1px solid var(--line);
    font-size:11px;font-weight:700;letter-spacing:0.3px;
  }
  .legend-badge .legend-cur{color:#ffffff;}
  .legend-badge .legend-arrow{color:var(--text-mute);}
  .legend-badge .legend-plan{color:var(--brass-hi);}
  .planner-window-frame{
    display:flex;
    padding:4px 0 0;
  }
  .planner-actions{
    display:flex;gap:8px;align-items:center;
    padding-top:6px;border-top:1px solid var(--line);
    margin-top:auto;
  }
  .planner-actions-arrow{
    flex:0 0 auto;color:var(--text-mute);font-size:18px;font-weight:700;
    padding:0 2px;
  }
  .planner-actions button{flex:1;}

  /* sticky action bar (mobile) */
  .action-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(12,14,18,0) 0%, rgba(12,14,18,0.9) 60%, rgba(12,14,18,1) 100%);
    display:flex;gap:10px;
  }
  .action-bar .btn-primary,.action-bar .btn-ghost{padding:13px 16px;font-size:14px;border-radius:12px;}
  .action-bar-chars{
    padding:8px 12px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);color:var(--text-dim);
    cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  }
  @media (min-width: 900px){ .action-bar{display:none;} }

  /* desktop floating action panel */
  .desktop-cta{
    display:none;gap:10px;
    max-width:800px;margin:14px auto 0;
  }
  @media (min-width: 900px){ .desktop-cta{display:flex;} }

  /* characters drawer */
  .drawer-bg{
    position:fixed;inset:0;z-index:30;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(2px);
    display:flex;justify-content:flex-end;
    animation:fadein 160ms ease-out;
  }
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .drawer{
    width:min(420px, 92vw);
    background:var(--bg);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;
    animation:slidein 200ms ease-out;
  }
  @keyframes slidein{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .drawer-head{
    padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .drawer-body{padding:8px 8px 16px;overflow-y:auto;}
  .char-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;border-radius:12px;cursor:pointer;
  }
  .char-row:hover{background:var(--card);}
  .char-row.on{background:var(--card);}
  .char-row .swatch{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
  }
  .char-row .meta{flex:1;min-width:0;}
  .char-row .name{font-size:14px;font-weight:700;}
  .char-row .sub{font-size:11px;color:var(--text-dim);display:flex;gap:6px;align-items:center;}

  /* login modal */
  .modal-bg{
    position:fixed;inset:0;z-index:40;
    background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .modal{
    width:min(420px, 100%);
    background:var(--bg);
    border:1px solid var(--line);border-radius:18px;
    padding:24px;
  }
  .modal h2{margin:0 0 8px;font-size:20px;letter-spacing:-0.3px;}
  .modal p{margin:0 0 16px;color:var(--text-dim);font-size:13px;line-height:1.5;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions button{flex:1;}

  .lock-pill{
    display:inline-flex;align-items:center;gap:4px;
    padding:1px 6px;border-radius:6px;
    background:rgba(255,255,255,0.04);
    font-size:10px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;
  }

  .chars-pill{
    display:flex;align-items:center;gap:8px;
    padding:6px 6px 6px 10px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);
    cursor:pointer;
  }
  .chars-pill .count{
    background:var(--brass);color:var(--bg);
    width:20px;height:20px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;
  }

  .ghost-link{color:var(--text-dim);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line);}
  .ghost-link:hover{color:var(--text);}

  /* ───── Read-only skills view (inside PlannerCard) ──────────────── */

  .ro-skills{
    display:flex;flex-direction:column;gap:12px;
    width:100%;
  }
  .ro-tabs{
    display:flex;gap:4px;
    background:var(--card-hi);
    border-radius:10px;
    padding:4px;
  }
  .ro-tab{
    all:unset;
    flex:1;
    cursor:pointer;
    padding:0;min-height:44px;text-align:center;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
    color:var(--text-dim);
    border-radius:7px;
    box-sizing:border-box;
  }
  .ro-tab.on{
    background:var(--bg);
    color:var(--text);
    box-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  .ro-subtabs{
    display:flex;gap:4px;
    width:100%;
    padding:0;
  }
  .ro-subtab{
    all:unset;cursor:pointer;
    flex:1 1 0;min-width:0;
    min-height:44px;
    display:inline-flex;align-items:center;justify-content:center;
    text-align:center;
    font-size:13px;font-weight:600;
    color:var(--text-mute);
    position:relative;
  }
  .ro-subtab:hover{color:var(--text-dim);}
  .ro-subtab.on{color:var(--text);}
  .ro-subtab.on::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:8px;
    width:60%;max-width:64px;
    height:2px;background:var(--brass);border-radius:1px;
  }

  .ro-summary{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;
    background:var(--card-hi);
    border-radius:10px;
    flex-wrap:wrap;gap:10px;
  }
  .ro-summary-left{display:inline-flex;align-items:center;gap:9px;min-width:0;}
  .ro-mastery-icon{
    width:26px;height:26px;border-radius:7px;flex-shrink:0;
    object-fit:cover;
    background:var(--card);
    border:1px solid rgba(212,168,71,0.30);
    padding:2px;box-sizing:border-box;
  }
  .ro-summary-name{font-size:14px;font-weight:700;letter-spacing:-0.1px;}
  .ro-summary-stats{display:flex;gap:18px;}
  .ro-summary-stats > span{display:inline-flex;align-items:baseline;gap:4px;}
  .ro-summary-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;margin-right:2px;}
  .ro-summary-val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
  .ro-summary-of{font-size:11px;color:var(--text-mute);font-variant-numeric:tabular-nums;}

  .ro-series-list{display:flex;flex-direction:column;gap:14px;padding:4px 2px;}
  .ro-series{display:flex;flex-direction:column;gap:6px;}
  .ro-series-head{
    display:flex;align-items:center;gap:8px;
    padding-left:2px;
  }
  .ro-series-glyph{
    width:22px;height:22px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(212,168,71,0.10);
    color:var(--brass-hi);
    font-size:12px;font-weight:800;
    border:1px solid rgba(212,168,71,0.18);
  }
  .ro-series-name{
    font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.8px;font-weight:700;
  }
  .ro-skill-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:flex-start;
  }
  .ro-series-icon{
    width:44px;height:44px;border-radius:8px;
    align-self:center;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(212,168,71,0.10);
    color:var(--brass-hi);
    font-size:18px;font-weight:800;
    border:1px solid rgba(212,168,71,0.18);
    box-sizing:border-box;
  }
  .ro-skill{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 0;
    border-radius:8px;
  }
  .ro-skill.locked{opacity:0.35;}
  .ro-skill-icon{
    width:44px;height:44px;
    border-radius:8px;
    background:var(--card-hi);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    padding:3px;box-sizing:border-box;
  }
  .ro-skill-icon img{width:100%;height:100%;border-radius:5px;object-fit:cover;}
  .ro-skill-level{
    font-size:12px;font-weight:700;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .ro-skill-level .lv-cur, .ro-summary-val .lv-cur, .ro-footer-val .lv-cur{color:#ffffff;}
  .ro-skill-level .lv-arrow, .ro-summary-val .lv-arrow, .ro-footer-val .lv-arrow{color:var(--text-mute);font-weight:600;}
  .ro-skill-level .lv-plan, .ro-summary-val .lv-plan, .ro-footer-val .lv-plan{color:var(--brass-hi);}
  .ro-skill.locked .ro-skill-level{color:var(--text-mute);}

  .ro-footer{
    display:flex;flex-direction:column;
    padding:10px 12px;margin-top:2px;
    background:var(--card-hi);
    border-radius:10px;
    gap:8px;
  }
  .ro-footer-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  }
  .ro-footer-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;}
  .ro-footer-val{display:inline-flex;align-items:baseline;gap:6px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brass-hi);white-space:nowrap;}
  .ro-footer-delta{color:var(--green);font-size:11px;font-weight:700;margin:0 2px;}
  .ro-footer-eq{color:var(--text-mute);font-weight:600;}
  .ro-footer-of{color:var(--text-mute);font-weight:600;font-size:11px;}

  /* ───── Fullscreen planner modal ────────────────────────────────── */

  .fs-bg{
    position:fixed;inset:0;z-index:50;
    background:rgba(8,9,12,0.85);
    backdrop-filter:blur(4px);
    animation:fadein 160ms ease-out;
  }
  .fs{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background:var(--bg);
    animation:slideup 240ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @media (min-width: 900px){
    .fs{
      inset:auto; width:min(820px, 92vw); height:min(880px, 92vh);
      top:50%; left:50%; transform:translate(-50%, -50%);
      border:1px solid var(--line); border-radius:18px;
      box-shadow:0 30px 80px rgba(0,0,0,0.6);
      overflow:hidden;
    }
  }
  @keyframes slideup{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @media (min-width: 900px){
    @keyframes slideup{from{transform:translate(-50%,-46%);opacity:0;}to{transform:translate(-50%,-50%);opacity:1;}}
  }

  .fs-head{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    flex-shrink:0;
  }
  .fs-back{
    width:44px;height:44px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .fs-back:hover{background:var(--card-hi);}
  .fs-title{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .fs-title-tag{
    font-size:11px;font-weight:800;letter-spacing:0.8px;
    padding:2px 8px;border-radius:6px;
  }
  .fs-tag-current{background:rgba(255,255,255,0.08);color:var(--text);}
  .fs-tag-future{background:rgba(244,216,120,0.16);color:var(--brass-hi);}
  .fs-title-name{font-size:16px;font-weight:700;letter-spacing:-0.2px;}

  .fs-body{
    flex:1;overflow-y:auto;
    padding:16px;
    -webkit-overflow-scrolling:touch;
  }
  @media (min-width: 900px){ .fs-body{padding:20px 28px;} }

  .fs-tabs{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .fs-tabs-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .fs-tabs-label{
    font-size:11px;font-weight:700;color:var(--text-mute);
    letter-spacing:1px;text-transform:uppercase;
    flex-shrink:0;
  }

  /* Mastery summary card */
  .fs-mastery{
    background:linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
    border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;
    display:flex;flex-direction:column;gap:14px;
  }
  .fs-mastery-info{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .fs-mastery-name{font-size:18px;font-weight:800;letter-spacing:-0.3px;}
  .fs-mastery-sub{color:var(--text-mute);font-size:13px;font-weight:500;letter-spacing:0;}
  .fs-mastery-stats{display:flex;gap:14px;flex-wrap:wrap;}
  .fs-mastery-stats > span{display:inline-flex;align-items:baseline;gap:6px;}
  .fs-stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;}
  .fs-stat-val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .fs-stat-of{font-size:12px;color:var(--text-mute);font-variant-numeric:tabular-nums;}

  .fs-mastery-controls{display:flex;align-items:center;gap:10px;}
  .fs-mastery-bar{
    flex:1;height:8px;border-radius:999px;
    background:rgba(255,255,255,0.05);
    overflow:hidden;
    position:relative;
  }
  .fs-mastery-bar-fill{
    height:100%;
    background:linear-gradient(90deg, var(--brass) 0%, var(--brass-hi) 100%);
    transition:width 180ms ease-out;
  }

  /* Bulk actions */
  .fs-actions{display:flex;gap:8px;margin:16px 0 18px;flex-wrap:wrap;}
  .fs-actions > button{flex:1;min-width:120px;}

  /* Series */
  .fs-series-list{display:flex;flex-direction:column;gap:18px;}
  .fs-series{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .fs-series-head{
    display:flex;align-items:center;gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,0.02);
  }
  .fs-series-glyph{
    width:28px;height:28px;border-radius:8px;
    background:linear-gradient(180deg, rgba(212,168,71,0.18), rgba(212,168,71,0.04));
    color:var(--brass-hi);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;
    border:1px solid rgba(212,168,71,0.25);
  }
  .fs-series-name{flex:1;font-size:13px;font-weight:700;letter-spacing:0.2px;}
  .fs-series-count{
    font-size:11px;color:var(--text-mute);
    font-variant-numeric:tabular-nums;
  }
  .fs-series-body{display:flex;flex-direction:column;}

  /* Skill row */
  .fs-skill-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;
    border-top:1px solid var(--line);
    min-height:64px;
  }
  .fs-skill-row:first-child{border-top:none;}
  .fs-skill-icon{
    all:unset;cursor:pointer;
    width:44px;height:44px;
    border-radius:10px;
    background:linear-gradient(180deg, #0a0a0b, #161618);
    box-shadow:0 0 0 1px #6b5a30 inset, 0 0 0 2px #000 inset;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .fs-skill-icon:hover{box-shadow:0 0 0 1px var(--brass-hi) inset, 0 0 0 2px #000 inset;}
  .fs-skill-icon img{width:36px;height:36px;border-radius:6px;display:block;}

  .fs-skill-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .fs-skill-name{font-size:14px;font-weight:600;color:var(--text);}
  .fs-skill-level{display:flex;align-items:center;gap:5px;font-size:13px;}
  .fs-level-num{color:var(--brass-hi);font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;}
  .fs-max-pill{
    margin-left:6px;padding:1px 6px;border-radius:4px;
    background:var(--brass);color:var(--bg);
    font-size:10px;font-weight:800;letter-spacing:0.4px;
  }

  .fs-skill-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .fs-step-btn{
    all:unset;cursor:pointer;
    width:44px;height:44px;border-radius:12px;
    background:var(--card-hi);
    border:1px solid var(--line);
    color:var(--text);
    font-size:20px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .fs-step-btn:hover{background:var(--card);border-color:#3a3f4b;}
  .fs-step-btn:active{transform:scale(0.95);}
  .fs-step-btn.primary{
    background:linear-gradient(180deg, var(--brass-hi), var(--brass));
    color:var(--bg);
    border:none;
  }
  .fs-max-tag{
    min-width:54px;height:44px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:12px;
    background:rgba(244,216,120,0.12);
    color:var(--brass-hi);
    font-size:12px;font-weight:800;letter-spacing:0.6px;
    border:1px solid rgba(244,216,120,0.25);
  }

  .fs-hint{
    margin:20px 0 0;
    font-size:11px;color:var(--text-mute);text-align:center;line-height:1.5;
  }

  .fs-foot{
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--bg);
    display:flex;gap:10px;
    flex-shrink:0;
  }
  .fs-foot button{
    border-radius:12px;font-weight:800;font-size:14px;
  }

  /* Skill info popover (modal-style) */
  .fs-info-bg{
    position:fixed;inset:0;z-index:60;
    background:rgba(0,0,0,0.6);
    display:flex;align-items:flex-end;justify-content:center;
    padding:0;
    animation:fadein 140ms ease-out;
  }
  @media (min-width: 700px){
    .fs-info-bg{align-items:center;padding:24px;}
  }
  .fs-info{
    width:100%;
    background:var(--bg);
    border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    padding:20px;
    position:relative;
    max-width:480px;
  }
  @media (min-width: 700px){
    .fs-info{border-radius:18px;border:1px solid var(--line);}
  }
  .fs-info-head{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
  .fs-info-icon{
    width:56px;height:56px;border-radius:12px;
    background:linear-gradient(180deg, #0a0a0b, #161618);
    box-shadow:0 0 0 1px var(--brass) inset, 0 0 0 2px #000 inset;
    padding:6px;box-sizing:border-box;
  }
  .fs-info-name{font-size:17px;font-weight:800;letter-spacing:-0.2px;}
  .fs-info-level{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .fs-info-body{display:flex;flex-direction:column;gap:0;}
  .fs-info-line{
    display:flex;justify-content:space-between;
    padding:8px 0;border-bottom:1px solid var(--line);
    font-size:13px;color:var(--text-dim);
  }
  .fs-info-line b{color:var(--text);}
  .fs-info-desc{
    margin:14px 0 0;
    font-size:13px;color:var(--text-dim);line-height:1.5;
  }

  /* ───── Create-character modal ───────────────────────────────────── */
  .cc-bg{
    position:fixed;inset:0;z-index:40;
    background:rgba(8,9,12,0.55);
    backdrop-filter:saturate(120%) blur(7px);
    -webkit-backdrop-filter:saturate(120%) blur(7px);
    display:flex;align-items:flex-start;justify-content:center;
    padding:76px 16px 28px;
    overflow-y:auto;
  }
  @media (min-width: 900px){ .cc-bg{align-items:center;padding:80px 24px 28px;} }
  .cc{
    position:relative;
    width:min(540px, 100%);
    background:linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    display:flex;flex-direction:column;gap:18px;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
  }
  .cc-close{position:absolute;top:14px;right:14px;}
  .cc-heading{font-size:18px;font-weight:800;letter-spacing:-0.3px;}
  .cc-field{display:flex;flex-direction:column;gap:9px;}
  .cc-label{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;}

  .cc-race-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .cc-race{
    all:unset;cursor:pointer;box-sizing:border-box;
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;min-height:60px;
    background:var(--card-hi);border:1px solid var(--line);border-radius:12px;
  }
  .cc-race:hover{border-color:#3a3f4b;}
  .cc-race.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset;}
  .cc-race-glyph{
    width:36px;height:36px;border-radius:999px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);
  }
  .cc-race.on .cc-race-glyph{border-color:var(--brass);box-shadow:0 0 10px rgba(212,168,71,0.25);}
  .cc-race-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .cc-race-name{font-size:14px;font-weight:700;}
  .cc-race-sub{font-size:11px;font-weight:600;color:var(--text-mute);}
  .cc-race.on .cc-race-sub{color:var(--brass-hi);}

  .cc-caps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .cc-cap{
    all:unset;cursor:pointer;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:12px 4px;
    background:var(--card-hi);border:1px solid var(--line);border-radius:12px;
    text-align:center;
  }
